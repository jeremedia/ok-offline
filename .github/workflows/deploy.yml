name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Parse changelog for release notes
      run: node scripts/parse-changelog.js
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        source: "dist/*"
        target: "/var/www/offline.oknotok.com"
        strip_components: 1
        rm: true
    
    - name: Clear Cloudflare cache (if applicable)
      run: |
        echo "Deployment complete!"
    
    # Send notification on failure
    - name: Notify failure
      if: failure()
      run: |
        echo "::error::Deployment failed! Check the logs for details."
        echo "Failed step: ${{ steps }}"
    
    # Optional: Create GitHub issue on failure
    - name: Create failure issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = `🚨 Deployment Failed: ${context.payload.head_commit.message.substring(0, 50)}`;
          const body = `
          ## Deployment Failure
          
          **Commit:** ${context.sha}
          **Author:** ${context.payload.head_commit.author.name}
          **Message:** ${context.payload.head_commit.message}
          **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
          
          Please investigate and fix the deployment issue.
          `;
          
          // Check if similar issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'deployment-failure'
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment-failure', 'bug', 'high-priority']
            });
          }