name: Tag explicit release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main-branch commit SHA to tag
        required: true
        type: string
      version:
        description: Exact package version, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify and create immutable tag
        shell: bash
        run: |
          [[ '${{ inputs.commit_sha }}' =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').version")" = '${{ inputs.version }}'
          git fetch origin main --tags
          git merge-base --is-ancestor '${{ inputs.commit_sha }}' origin/main
          ! git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1
          git tag -a "v${{ inputs.version }}" '${{ inputs.commit_sha }}' -m "OK-OFFLINE v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
