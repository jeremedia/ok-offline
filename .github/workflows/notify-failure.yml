name: Notify on Deployment Failure

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Send notification
        run: |
          echo "🚨 Deployment Failed!"
          echo "Repository: ${{ github.repository }}"
          echo "Failed workflow: ${{ github.event.workflow_run.name }}"
          echo "Commit: ${{ github.event.workflow_run.head_commit.message }}"
          echo "Author: ${{ github.event.workflow_run.head_commit.author.name }}"
          echo "View run: ${{ github.event.workflow_run.html_url }}"
      
