<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OK-OFFLINE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2a2a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OK-OFFLINE">
  <meta name="description" content="Offline-first guide for Burning Man camps, art, and events">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="OK-OFFLINE - Your offline guide to the playa">
  <meta property="og:description" content="Offline-first Progressive Web App for Burning Man. Browse camps, art installations, and events without connectivity.">
  <meta property="og:image" content="https://offline.oknotok.com/images/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://offline.oknotok.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OK-OFFLINE">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OK-OFFLINE - Your offline guide to the playa">
  <meta name="twitter:description" content="Offline-first Progressive Web App for Burning Man. Browse camps, art installations, and events without connectivity.">
  <meta name="twitter:image" content="https://offline.oknotok.com/images/og-default.png">
  <meta name="twitter:site" content="@oknotok">
  <meta name="twitter:creator" content="@oknotok">
  
  <!-- Main application styles -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- Initial loading styles -->
  <style>
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #2a2a2a; /* Neutral gray that works for all themes */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff; /* High contrast white text */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader-content {
      text-align: center;
      box-sizing: border-box;
      width: min(380px, calc(100% - 32px));
      padding: 24px;
    }
    
    .loader-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #666666; /* Neutral gray logo */
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: white;
    }
    
    .loader-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff; /* High contrast white */
      text-wrap: balance;
    }
    
    .loader-subtitle {
      font-size: 14px;
      color: #cccccc; /* Light gray for good readability */
      margin-bottom: 30px;
      text-wrap: pretty;
    }
    
    .loader-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid rgba(255, 255, 255, 0.2); /* Neutral white border */
      border-top-color: #ffffff; /* White spinner */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loader-status {
      font-size: 12px;
      color: #cccccc; /* Light gray for readability */
      margin-top: 10px;
    }
    
    .loader-progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2); /* Neutral progress background */
      border-radius: 2px;
      overflow: hidden;
      margin-top: 20px;
    }
    
    .loader-progress-bar {
      height: 100%;
      background: #ffffff; /* White progress bar */
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    
    .loader-version {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #999999; /* Lighter gray for version text */
      font-family: 'Berkeley Mono', 'SF Mono', Monaco, monospace;
    }

    .loader-error {
      display: none;
      text-align: left;
    }

    #initial-loader.is-error .loader-loading {
      display: none;
    }

    #initial-loader.is-error {
      box-sizing: border-box;
      justify-content: flex-start;
      padding: 24px 0;
      overflow-y: auto;
    }

    #initial-loader.is-error .loader-content {
      margin: auto;
    }

    #initial-loader.is-error .loader-error {
      display: block;
      animation: loader-error-enter 180ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    #initial-loader.is-error .loader-logo {
      background: #8b1e1e;
      width: 64px;
      height: 64px;
      margin-bottom: 14px;
      border-radius: 16px;
      font-size: 30px;
    }

    #initial-loader.is-error .loader-subtitle {
      margin-bottom: 20px;
    }

    #initial-loader.is-error .loader-version {
      position: static;
      margin-top: 16px;
      transform: none;
    }

    .loader-error-kicker {
      margin-bottom: 8px;
      color: #ffb4ab;
      font-family: 'Berkeley Mono', 'SF Mono', Monaco, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .loader-error-title {
      margin: 0 0 10px;
      color: #ffffff;
      font-size: 21px;
      line-height: 1.2;
      text-wrap: balance;
    }

    .loader-error-copy {
      margin: 0 0 16px;
      color: #d7d7d7;
      font-size: 14px;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .loader-error-message {
      max-height: 96px;
      margin-bottom: 16px;
      padding: 12px;
      overflow: auto;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      color: #ffb4ab;
      font-family: 'Berkeley Mono', 'SF Mono', Monaco, monospace;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .loader-error-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .loader-error-button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #f3f3f3;
      color: #1f1f1f;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      transition-property: transform, background-color;
      transition-duration: 120ms;
      transition-timing-function: ease;
    }

    .loader-error-button.secondary {
      background: #454545;
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .loader-error-button:hover {
      background: #ffffff;
    }

    .loader-error-button.secondary:hover {
      background: #525252;
    }

    .loader-error-button:active {
      transform: scale(0.96);
    }

    .loader-error-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .loader-error-footnote {
      margin: 14px 0 0;
      color: #aaaaaa;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
      text-wrap: pretty;
    }

    @keyframes loader-error-enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      .loader-content {
        padding: 18px;
      }

      .loader-error-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #initial-loader,
      .loader-error-button {
        transition-duration: 0.01ms;
      }

      #initial-loader.is-error .loader-error,
      .loader-spinner {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Initial loading screen -->
  <div id="initial-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="loader-content">
      <div class="loader-logo">OK</div>
      <h1 class="loader-title">OK-OFFLINE</h1>
      <p class="loader-subtitle">Your guide to the playa</p>
      <div class="loader-loading">
        <div class="loader-spinner"></div>
        <div class="loader-status">Initializing app...</div>
        <div class="loader-progress">
          <div class="loader-progress-bar" id="progress-bar"></div>
        </div>
      </div>
      <div class="loader-error" id="loader-error" hidden>
        <div class="loader-error-kicker">Startup interrupted</div>
        <h2 class="loader-error-title">OK-OFFLINE couldn’t start</h2>
        <p class="loader-error-copy" id="loader-error-copy">The app hit an error before it finished loading.</p>
        <div class="loader-error-message" id="loader-error-message"></div>
        <div class="loader-error-actions">
          <button class="loader-error-button" id="loader-retry" type="button">Try again</button>
          <button class="loader-error-button secondary" id="loader-copy" type="button">Copy details</button>
        </div>
        <p class="loader-error-footnote">Your downloaded data, favorites, and schedule have not been deleted.</p>
      </div>
    </div>
    <div class="loader-version" id="version-display">v{{APP_VERSION}}</div>
  </div>
  
  <div id="app"></div>
  
  <script>
    (function initializeStartupBoundary() {
      const loader = document.getElementById('initial-loader');
      const errorPanel = document.getElementById('loader-error');
      const errorCopy = document.getElementById('loader-error-copy');
      const errorMessage = document.getElementById('loader-error-message');
      const retryButton = document.getElementById('loader-retry');
      const copyButton = document.getElementById('loader-copy');
      const startedAt = new Date();
      let startupState = 'loading';
      let diagnostics = '';

      function normalizeError(error) {
        const value = error && error.message ? error.message : String(error || 'Unexpected startup error');
        return value.replace(/\s+/g, ' ').trim().slice(0, 320);
      }

      function buildDiagnostics(message, phase) {
        return [
          'OK-OFFLINE startup failure',
          `Time: ${new Date().toISOString()}`,
          `Phase: ${phase}`,
          `Message: ${message}`,
          `URL: ${window.location.href}`,
          `Online: ${navigator.onLine}`,
          `Version: ${document.getElementById('version-display')?.textContent || 'unknown'}`,
          `Browser: ${navigator.userAgent}`
        ].join('\n');
      }

      window.updateLoadingStatus = function(status, progress) {
        if (startupState !== 'loading') return;
        const statusEl = document.querySelector('.loader-status');
        const progressBar = document.getElementById('progress-bar');

        if (statusEl) statusEl.textContent = status;
        if (progressBar && progress !== undefined) {
          progressBar.style.width = `${Math.max(0, Math.min(100, progress))}%`;
        }
      };

      window.showInitialLoaderError = function(error, options) {
        if (startupState !== 'loading' || !loader) return;
        startupState = 'error';
        clearTimeout(window.__okOfflineStartupTimeout);

        const phase = options && options.phase ? options.phase : 'application startup';
        const message = normalizeError(error);
        diagnostics = buildDiagnostics(message, phase);

        loader.classList.add('is-error');
        loader.setAttribute('role', 'alert');
        loader.setAttribute('aria-live', 'assertive');
        loader.setAttribute('aria-busy', 'false');
        errorPanel.hidden = false;
        errorMessage.textContent = message;
        errorCopy.textContent = navigator.onLine
          ? 'The app hit an error before it finished loading. Try reloading, then copy the details if it happens again.'
          : 'This device appears to be offline and the app could not finish starting. Reconnect once, then try again.';
        loader.scrollTop = 0;
      };

      window.hideInitialLoader = function() {
        if (startupState !== 'loading' || !loader) return;
        startupState = 'ready';
        clearTimeout(window.__okOfflineStartupTimeout);
        loader.setAttribute('aria-busy', 'false');
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.style.display = 'none';
        }, 300);
      };

      retryButton.addEventListener('click', function() {
        window.location.reload();
      });

      copyButton.addEventListener('click', async function() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(diagnostics);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = diagnostics;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            textarea.remove();
          }
          copyButton.textContent = 'Details copied';
          setTimeout(() => { copyButton.textContent = 'Copy details'; }, 1800);
        } catch (error) {
          copyButton.textContent = 'Copy failed';
          setTimeout(() => { copyButton.textContent = 'Copy details'; }, 1800);
        }
      });

      window.addEventListener('error', function(event) {
        if (!event.error && !event.message) return;
        window.showInitialLoaderError(event.error || event.message, { phase: 'JavaScript startup' });
      });

      window.addEventListener('unhandledrejection', function(event) {
        window.showInitialLoaderError(event.reason, { phase: 'asynchronous startup' });
      });

      window.__okOfflineStartupTimeout = setTimeout(function() {
        const elapsedSeconds = Math.round((Date.now() - startedAt.getTime()) / 1000);
        window.showInitialLoaderError(
          new Error(`Startup did not finish after ${elapsedSeconds} seconds.`),
          { phase: 'startup timeout' }
        );
      }, 30000);
    })();
  </script>
  
  <script id="ok-offline-entry" type="module" src="/src/main.js"></script>
  <script>
    const applicationEntry = document.getElementById('ok-offline-entry')
      || Array.from(document.querySelectorAll('script[type="module"][src]'))
        .find(function(script) { return !script.src.includes('/@vite/client'); });
    if (applicationEntry) {
      applicationEntry.addEventListener('error', function() {
        window.showInitialLoaderError(
          new Error('The application entry module could not be loaded.'),
          { phase: 'application download' }
        );
      });
    }
  </script>
</body>
</html>
